name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        env:
          VITE_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzUjsQRBGXvUfMNM9tVV1ZEDpmLvIk47XQbsnK1MB4QGjA-9ECJ_-gyDt46NedMLHF1/exec
          VITE_FIREBASE_API_KEY: AIzaSyCO9qBaurZAndOW2w-LdGZGeq6Kzmxw-hg
          VITE_FIREBASE_AUTH_DOMAIN: duta-kampus.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: duta-kampus
          VITE_FIREBASE_STORAGE_BUCKET: duta-kampus.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 960208224753
          VITE_FIREBASE_APP_ID: 1:960208224753:web:9669f19a3b9f4d68c20450
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
